
<!DOCTYPE html>
<html lang='ko'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel='icon' type='image/x-icon' href='favicon.ico'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>검색 결과 - sdss.kr</title>
    <style>
        /* ===== CSS 변수 (라이트 모드 - 빔프로젝터 최적화) ===== */
        :root {
            --bg-primary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #000000;
            --text-secondary: #333333;
            --text-muted: #555555;
            --border-color: #999999;
            --border-light: #cccccc;
            --accent: #0044cc;
            --accent-hover: #002288;
            --accent-light: #e8f0fe;
            --accent-gradient: linear-gradient(135deg, #0044cc, #0033aa);
            --table-header-bg: #1a1a1a;
            --table-header-text: #ffffff;
            --table-row-hover: #e8e8e8;
            --table-row-alt: #f2f2f2;
            --correct-bg: #b6f2b6;
            --correct-text: #005500;
            --correct-border: #00aa00;
            --error-bg: #ffe0e0;
            --error-text: #880000;
            --error-border: #cc0000;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
            --shadow-md: 0 4px 8px rgba(0,0,0,0.15);
            --shadow-lg: 0 8px 20px rgba(0,0,0,0.2);
            --radius: 10px;
            --radius-sm: 6px;
            --tag-bg: #e0e0e0;
            --tag-text: #222222;
            --footer-bg: #f0f0f0;
            --footer-text: #666666;
            --badge-bg: #d0e4ff;
            --badge-text: #003399;
        }

        /* ===== 다크 모드 (빔프로젝터 최적화) ===== */
        [data-theme="dark"] {
            --bg-primary: #0a0a0a;
            --bg-card: #141414;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --text-muted: #999999;
            --border-color: #555555;
            --border-light: #333333;
            --accent: #66aaff;
            --accent-hover: #99ccff;
            --accent-light: #1a2d4a;
            --accent-gradient: linear-gradient(135deg, #66aaff, #88bbff);
            --table-header-bg: #222222;
            --table-header-text: #ffffff;
            --table-row-hover: #2a2a2a;
            --table-row-alt: #1a1a1a;
            --correct-bg: #0a3d0a;
            --correct-text: #66ff66;
            --correct-border: #33cc33;
            --error-bg: #3d0a0a;
            --error-text: #ff8888;
            --error-border: #cc3333;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);
            --shadow-md: 0 4px 8px rgba(0,0,0,0.6);
            --shadow-lg: 0 8px 20px rgba(0,0,0,0.7);
            --tag-bg: #333333;
            --tag-text: #eeeeee;
            --footer-bg: #141414;
            --footer-text: #888888;
            --badge-bg: #1a2d4a;
            --badge-text: #88ccff;
        }

        /* ===== 글로벌 리셋 ===== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 다크모드 토글 ===== */
        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
            width: 48px;
            height: 48px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-md);
        }
        .theme-toggle:hover {
            transform: scale(1.08);
            box-shadow: var(--shadow-lg);
        }
        .theme-toggle svg {
            width: 22px;
            height: 22px;
            fill: var(--text-primary);
            display: block;
        }

        /* ===== 컨테이너 ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px 48px;
        }

        /* ===== 사이트 로고 ===== */
        .site-logo {
            text-align: center;
            margin-bottom: 12px;
        }
        .site-logo a {
            font-size: 3.2em;
            font-weight: 900;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            letter-spacing: -1px;
            transition: opacity 0.2s ease;
        }
        .site-logo a:hover {
            opacity: 0.8;
        }

        /* ===== 검색 헤더 ===== */
        .search-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .search-header h1 {
            font-size: 1.8em;
            font-weight: 900;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .search-meta {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .meta-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 1em;
            font-weight: 700;
        }
        .meta-badge svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
        .meta-hint {
            color: var(--text-muted);
            font-size: 0.95em;
            font-weight: 600;
        }

        /* ===== 테이블 카드 ===== */
        .table-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            border: 2px solid var(--border-color);
        }
        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* ===== 테이블 ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1.05em;
        }
        thead th {
            background-color: var(--table-header-bg);
            color: var(--table-header-text);
            padding: 16px 14px;
            text-align: center;
            font-weight: 800;
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 3px solid var(--border-color);
            border-right: 1px solid rgba(255,255,255,0.15);
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        thead th:last-child {
            border-right: none;
        }
        /* 정답률 헤더 강조 */
        thead th.col-rate {
            font-size: 1.25em;
            letter-spacing: 0;
            text-transform: none;
        }
        /* 선택지 헤더 강조 */
        thead th.col-option {
            font-size: 1.25em;
            letter-spacing: 0;
            text-transform: none;
        }
        tbody td {
            padding: 14px 12px;
            text-align: center;
            border-bottom: 2px solid var(--border-light);
            border-right: 1px solid var(--border-light);
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
        }
        tbody td:last-child {
            border-right: none;
        }
        /* 지문 제목은 줄바꿈 허용 */
        tbody td.col-title {
            white-space: normal;
            text-align: left;
            max-width: 260px;
            font-weight: 700;
        }
        /* 코드 칼럼 */
        tbody td.col-code {
            white-space: normal;
            max-width: 220px;
        }
        tbody tr {
            transition: background-color 0.15s ease;
        }
        tbody tr:nth-child(even) {
            background-color: var(--table-row-alt);
        }
        tbody tr:hover {
            background-color: var(--table-row-hover);
        }

        /* 정답 셀 */
        .correct-answer-cell {
            background-color: var(--correct-bg) !important;
            color: var(--correct-text) !important;
            font-weight: 900 !important;
            border-left: 4px solid var(--correct-border);
        }

        /* 정답률 컬럼 */
        td.col-rate {
            font-weight: 900;
            font-size: 1.5em;
        }

        /* 선택지 컬럼 */
        td.col-option {
            font-size: 1.3em;
            font-weight: 800;
        }

        /* ===== 링크 스타일 ===== */
        .clickable-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.15s ease;
        }
        .clickable-link:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        /* 코드 태그 스타일 */
        .code-tag {
            display: inline-block;
            background: var(--tag-bg);
            color: var(--tag-text);
            padding: 5px 14px;
            border-radius: 6px;
            font-size: 1.05em;
            font-weight: 800;
            margin: 3px;
            border: 1px solid var(--border-color);
            transition: background 0.15s ease;
            text-decoration: none;
        }
        .code-tag:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        /* ===== 에러 ===== */
        .error-card {
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
            padding: 40px 24px;
            border-radius: var(--radius);
            text-align: center;
            font-weight: 600;
            font-size: 1em;
        }

        /* ===== 하단 버튼 ===== */
        .actions {
            text-align: center;
            margin-top: 32px;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-gradient);
            color: #fff;
            padding: 14px 32px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-weight: 800;
            font-size: 1.1em;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: var(--shadow-sm);
        }
        .btn-back:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .btn-back svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* ===== 푸터 ===== */
        .footer {
            text-align: center;
            padding: 24px;
            margin-top: 48px;
            color: var(--footer-text);
            font-size: 0.82em;
            border-top: 1px solid var(--border-color);
        }

        /* ===== 반응형 ===== */
        @media (max-width: 768px) {
            .container {
                padding: 20px 12px 36px;
            }
            .site-logo a {
                font-size: 2em;
            }
            .search-header h1 {
                font-size: 1.2em;
            }
            table {
                font-size: 0.82em;
            }
            thead th {
                padding: 10px 8px;
            }
            tbody td {
                padding: 10px 8px;
            }
            .theme-toggle {
                top: 16px;
                right: 16px;
                width: 42px;
                height: 42px;
            }
        }
    </style>
</head>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = document.querySelector('.sun-icon');
        const moonIcon = document.querySelector('.moon-icon');
        const html = document.documentElement;

        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
            html.setAttribute('data-theme', 'dark');
            sunIcon.style.display = 'none';
            moonIcon.style.display = 'block';
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                html.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            } else {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            }
        });
    </script>
